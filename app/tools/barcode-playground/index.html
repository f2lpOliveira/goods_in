<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Barcode Playground</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main>
      <h1>Barcode Playground</h1>

      <label for="barcode-input"> Barcode </label>

      <input id="barcode-input" type="text" autocomplete="off" />

      <button id="parse-button">Parse Barcode</button>

      <hr />

      <section id="result-panel">
        <h2>Result</h2>

        <div class="field">
          <strong>Status</strong>
          <p id="status">Waiting...</p>
        </div>

        <div class="field">
          <strong>GTIN</strong>
          <p id="gtin">—</p>
        </div>

        <div class="field">
          <strong>Product Code</strong>
          <p id="product-code">—</p>
        </div>

        <div class="field">
          <strong>Description</strong>
          <p id="description">—</p>
        </div>

        <div class="field">
          <strong>Batch</strong>
          <p id="batch">—</p>
        </div>

        <div class="field">
          <strong>Production Date</strong>
          <p id="production-date">—</p>
        </div>

        <div class="field">
          <strong>Best Before</strong>
          <p id="best-before">—</p>
        </div>

        <div class="field">
          <strong>Raw Barcode</strong>
          <p id="raw-barcode">—</p>
        </div>
      </section>
      <section id="unknown-product" hidden>
        <h2>Register Product</h2>

        <label for="new-product-code"> Product Code </label>

        <input id="new-product-code" type="text" />

        <label for="new-product-description"> Description </label>

        <input id="new-product-description" type="text" />

        <button id="save-product">Save Product</button>
      </section>
    </main>

    <script type="module" src="./barcode-playground.js"></script>
  </body>
</html>
